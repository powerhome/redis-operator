---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/name: redis-operator
    app.kubernetes.io/instance: redis-operator
  name: redis-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
      app.kubernetes.io/name: redis-operator
      app.kubernetes.io/instance: redis-operator
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        app.kubernetes.io/name: redis-operator
        app.kubernetes.io/instance: redis-operator
    spec:
      serviceAccountName: redisoperator
      containers:
        - image: powerhome/redis-operator:2a0c39827b65ee6efa35da98c6b668af503f05b3-dirty
          imagePullPolicy: IfNotPresent
          name: app
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            limits:
              memory: 50Mi
            requests:
              cpu: 10m
              memory: 50Mi
      restartPolicy: Always
