version: "2"

linters:
  # Keep the enforced set as it was under golangci-lint v1. Version 2 merged
  # gosimple, staticcheck and stylecheck into one linter and turned on its
  # quickfix (QF) and style (ST) checks, and it dropped the default exclusions
  # that suppressed `defer x.Close()`. Both are worth considering on their own
  # merits; neither should arrive as a side effect of a toolchain bump.
  settings:
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST*
  exclusions:
    presets:
      - std-error-handling
    rules:
      # The operator reads `hostNetwork` and `dnsPolicy` for as long as it
      # honours them, which is what deprecating rather than removing them
      # means, and SA1019 reports every one of those reads. Matched on these
      # two fields of these two types, so SA1019 still reports every other use
      # of a deprecated API.
      - linters:
          - staticcheck
        text: 'SA1019: \(github\.com/spotahome/redis-operator/api/redisfailover/v1\.(Redis|Sentinel)Settings\)\.(HostNetwork|DNSPolicy) is deprecated'
