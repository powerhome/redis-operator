{{- if and .Values.operators.redis .Values.redis }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/name: redis-operator
    app.kubernetes.io/instance: redis-operator
  name: redis-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
      app.kubernetes.io/name: redis-operator
      app.kubernetes.io/instance: redis-operator
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        app.kubernetes.io/name: redis-operator
        app.kubernetes.io/instance: redis-operator
    spec:
      serviceAccountName: redis-operator
      containers:
        - image: {{ include "redisfailover-bundle.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          name: app
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9710
              protocol: TCP
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: redis-operator-metrics
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/name: redis-operator
    app.kubernetes.io/instance: redis-operator
spec:
  type: ClusterIP
  ports:
    - port: 9710
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/component: operator
    app.kubernetes.io/name: redis-operator
    app.kubernetes.io/instance: redis-operator
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-operator-metrics
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/name: redis-operator
    app.kubernetes.io/instance: redis-operator
    prometheus: {{ .Values.serviceMonitor.prometheus | quote }}
spec:
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
      app.kubernetes.io/name: redis-operator
      app.kubernetes.io/instance: redis-operator
{{- end }}
