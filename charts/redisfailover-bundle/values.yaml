# Compatibility chart for example-rails-app-style Redis deployments.
#
# This chart installs:
# - one RedisFailover resource per redis.<instance> entry
# - per-instance Redis and HAProxy ServiceMonitors
# - a bootstrap Service used for cross-cluster replication
#
# This chart assumes the Redis operator, RedisFailover CRD, service account, and
# RBAC are already present in the target cluster/namespace.

applicationName: example-rails-app
environment: review

cluster:
  name: ""
  replicaCluster: ""

serviceMonitor:
  prometheus: kube-prometheus

redis:
  defaultInstance: cache
  cache:
    enabled: true
    port: 6379
    replication: "disabled"
    replicaCount:
      haproxy: 2
      sentinel: 3
      redis: 3
    storage:
      keepAfterDeletion: false
      storageClass: block
      volumeSize: 2Gi
    resources:
      limits:
        memory: 500Mi
        ephemeral-storage: 50Mi
      requests:
        cpu: 100m
        memory: 500Mi
        ephemeral-storage: 50Mi
