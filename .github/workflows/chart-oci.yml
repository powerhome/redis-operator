name: Publish Charts OCI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm test
        run: make test-helm-ci

      - name: Resolve OCI target
        id: target
        run: |
          owner="$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')"
          echo "repo=registry-1.docker.io/${owner}" >> "${GITHUB_OUTPUT}"

      - name: Resolve chart versions
        id: versions
        run: |
          bundle_version="$(awk '/^version:/ {print $2; exit}' charts/redisfailover-bundle/Chart.yaml)"
          bundle_app_version="$(awk -F'"' '/^appVersion:/ {print $2; exit}' charts/redisfailover-bundle/Chart.yaml)"

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
            suffix="sha.${short_sha}"
            bundle_version="${bundle_version}-${suffix}"
          else
            bundle_app_version="${GITHUB_REF_NAME}"
          fi

          {
            echo "bundle_version=${bundle_version}"
            echo "bundle_app_version=${bundle_app_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to DockerHub OCI
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Package charts
        run: |
          mkdir -p .chart-packages
          helm package charts/redisfailover-bundle \
            --version "${{ steps.versions.outputs.bundle_version }}" \
            --app-version "${{ steps.versions.outputs.bundle_app_version }}" \
            --destination .chart-packages

      - name: Push charts
        run: |
          for package in .chart-packages/*.tgz; do
            helm push "${package}" "oci://${{ steps.target.outputs.repo }}"
          done
