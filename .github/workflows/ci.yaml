name: CI

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'master'

env:
  DOCKER_METADATA_PR_HEAD_SHA: true

jobs:
  check:
    name: Golang Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.2
          args: --timeout=15m

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - run: make test-unit-ci

  integration-test:
    name: Integration test
    runs-on: ubuntu-22.04
    needs:
      - check
      - unit-test
    strategy:
      matrix:
        kubernetes:
          - 1.32.8
          - 1.33.8
          - 1.34.4
          - 1.35.1
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: Install conntrack
        run: sudo apt-get install -y conntrack
      # medyagh/setup-minikube chmods /etc/cni/net.d without creating it, and the
      # runner image no longer ships that directory.
      # Upstream fix: https://github.com/medyagh/setup-minikube/pull/836
      - name: Ensure CNI config directory exists
        run: sudo mkdir -p /etc/cni/net.d
      - uses: medyagh/setup-minikube@v0.0.18
        with:
          kubernetes-version: ${{ matrix.kubernetes }}
          minikube-version: 1.38.1
          driver: none
      - name: Add redisfailover CRD
        run: kubectl create -f manifests/databases.spotahome.com_redisfailovers.yaml
      - run: make test-integration-ci

  chart-test:
    name: Chart testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.7.2

      - name: Helm test
        run: make test-helm-ci

  # Fail if the chart's bundled CRD has drifted from the generated manifests.
  # `make generate-crd` copies manifests/databases.spotahome.com_redisfailovers.yaml
  # into the chart, so the two files must be byte-for-byte identical. When they
  # differ, regenerate with `make generate-crd` (or copy the manifest into the
  # chart) and commit the result.
  chart-crd-drift:
    name: Chart CRD drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compare chart CRD with generated manifest
        run: |
          if ! diff -u \
            manifests/databases.spotahome.com_redisfailovers.yaml \
            charts/redisoperator/crds/databases.spotahome.com_redisfailovers.yaml; then
            echo "::error::The chart's bundled CRD has drifted from manifests/. Run 'make generate-crd' and commit the result."
            exit 1
          fi

  # Despite the name, this job publishes the operator image to both Docker Hub
  # (powerhome/redis-operator) and ghcr.io/powerhome/redis-operator in one build.
  # Kept as `dockerhub-image` to avoid renaming a status check that branch
  # protection may require; see PR #93 discussion.
  dockerhub-image:
    needs:
      - check
      - unit-test
      - integration-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            powerhome/redis-operator
            ghcr.io/powerhome/redis-operator
          tags: |
            type=semver,pattern={{raw}}
            type=sha,prefix=,suffix=,format=long
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/bake-action@v5
        with:
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: build
          push: true
      - name: Verify the ghcr package is publicly pullable
        if: github.event_name != 'pull_request'
        run: |
          tag='${{ steps.meta.outputs.version }}'
          token=$(curl -sf "https://ghcr.io/token?scope=repository:powerhome/redis-operator:pull&service=ghcr.io" | jq -r .token)
          curl -sf -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/powerhome/redis-operator/manifests/$tag" \
            || { echo "ghcr package is not anonymously pullable"; exit 1; }

  # On an operator release (a `v*` tag that built and published the operator
  # image above), bump the chart's appVersion, version, and default image tag to
  # match, then push the change to master. That push triggers the Release Charts
  # workflow, which publishes the chart to both the HTTP repo and ghcr.io/OCI at
  # the new version -- so nobody hand-edits the chart to track the operator.
  chart-version-sync:
    name: Sync chart to released operator
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - dockerhub-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump chart to match released operator
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"   # e.g. v4.6.0
          version="${tag#v}"          # e.g. 4.6.0
          chart=charts/redisoperator/Chart.yaml
          values=charts/redisoperator/values.yaml
          sed -i -E "s|^appVersion: .*|appVersion: ${version}|" "${chart}"
          sed -i -E "s|^version: .*|version: ${version}|" "${chart}"
          sed -i -E "s|^  tag: .*|  tag: ${tag}|" "${values}"
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- charts/redisoperator/Chart.yaml charts/redisoperator/values.yaml; then
            echo "Chart already in sync with ${GITHUB_REF_NAME}; nothing to do."
            exit 0
          fi
          git add charts/redisoperator/Chart.yaml charts/redisoperator/values.yaml
          git commit -m "chore(chart): sync chart to operator ${GITHUB_REF_NAME}"
          git push origin HEAD:master
