name: CI

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'master'

env:
  DOCKER_METADATA_PR_HEAD_SHA: true

jobs:
  check:
    name: Golang Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=15m

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-unit-ci

  integration-test:
    name: Integration test
    runs-on: ubuntu-22.04
    needs:
      - check
      - unit-test
    strategy:
      matrix:
        kubernetes:
          - 1.32.8
          - 1.33.8
          - 1.34.4
          - 1.35.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install conntrack
        run: sudo apt-get install -y conntrack
      # medyagh/setup-minikube chmods /etc/cni/net.d without creating it, and the
      # runner image no longer ships that directory.
      # Upstream fix: https://github.com/medyagh/setup-minikube/pull/836
      - name: Ensure CNI config directory exists
        run: sudo mkdir -p /etc/cni/net.d
      - uses: medyagh/setup-minikube@v0.0.18
        with:
          kubernetes-version: ${{ matrix.kubernetes }}
          minikube-version: 1.38.1
          driver: none
      - name: Add redisfailover CRD
        run: kubectl create -f manifests/databases.spotahome.com_redisfailovers.yaml
      - run: make test-integration-ci

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: make lint-workflows

  chart-test:
    name: Chart testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm test
        run: make test-helm-ci

  # `make generate-crd` writes the same CRD into manifests/, its kustomize base,
  # and the chart from a single source, so those three committed copies must be
  # byte-for-byte identical. This gate fails when the chart's bundled CRD (or
  # the kustomize base) has drifted from manifests/, which is the drift that can
  # actually merge here. When it fails, run `make generate-crd` and commit all
  # three.
  #
  # It compares the committed files rather than regenerating in CI on purpose.
  # `make generate-crd` does run now -- the Makefile passes GOTOOLCHAIN=auto so
  # the pinned codegen image (which ships an older Go than go.mod requires)
  # fetches the toolchain go.mod names -- but that regeneration is only run
  # locally today and downloads a toolchain at container start, which is not yet
  # wired up or validated on a runner. Until it is, this cheap committed-copy
  # diff is the gate; switching it to regenerate-and-diff is a follow-up.
  chart-crd-drift:
    name: Chart CRD drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chart and kustomize CRDs must match manifests/
        run: |
          gen=manifests/databases.spotahome.com_redisfailovers.yaml
          rc=0
          for copy in \
            manifests/kustomize/base/databases.spotahome.com_redisfailovers.yaml \
            charts/redisoperator/crds/databases.spotahome.com_redisfailovers.yaml; do
            if ! diff -u "${gen}" "${copy}"; then
              echo "::error::${copy} has drifted from ${gen}. Run 'make generate-crd' and commit the result."
              rc=1
            fi
          done
          exit "${rc}"

  # The chart ships the operator, so its appVersion and default image tag must
  # name the operator VERSION. These fields live in source (set in the
  # "Prepare release vX.Y.Z" commit alongside Makefile VERSION) and this job
  # gates them -- CI never writes them back. The chart's own `version` is
  # intentionally not checked here: it moves independently for chart-only
  # releases. Reusing an already-published chart version while changing this
  # metadata is caught at publish time instead -- scripts/publish-oci-chart.sh
  # compares against the published artifact and fails rather than no-opping.
  chart-version-check:
    name: Chart version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: appVersion and image.tag must match Makefile VERSION
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION := //p' Makefile | head -1)"
          app_version="$(helm show chart charts/redisoperator | awk '/^appVersion:/ {print $2; exit}')"
          img_tag="$(helm show values charts/redisoperator | awk '/^image:/{f=1; next} f&&/^[^[:space:]]/{f=0} f&&/^[[:space:]]+tag:/{print $2; exit}')"
          echo "Makefile VERSION=${version} chart appVersion=${app_version} image.tag=${img_tag}"
          rc=0
          # On a release tag, the tag itself must equal VERSION. The operator
          # image is tagged from the git ref, so a tag cut from a commit whose
          # VERSION differs would publish an image with no matching chart.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" != "${version}" ]; then
            echo "::error::Release tag (${GITHUB_REF_NAME:-}) != Makefile VERSION (${version}). Cut the tag from the release commit (make tag-operator)."
            rc=1
          fi
          # Prerelease tags (e.g. v4.7.0-rc1, any SemVer with a `-` suffix) are
          # refused. The chart names one operator version in appVersion and
          # image.tag, both held equal to VERSION, so a prerelease image can only
          # ship under a chart presenting it as an ordinary release. Refuse it
          # here; add an explicit prerelease flow if that is ever wanted.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            case "${GITHUB_REF_NAME:-}" in
              *-*)
                echo "::error::Release tag (${GITHUB_REF_NAME}) is a prerelease. Releases are stable vX.Y.Z tags only; cut a stable tag or add a deliberate prerelease flow."
                rc=1
                ;;
            esac
          fi
          if [ "${app_version}" != "${version}" ]; then
            echo "::error::Chart appVersion (${app_version}) != Makefile VERSION (${version}). Update charts/redisoperator/Chart.yaml in the release commit."
            rc=1
          fi
          if [ "${img_tag}" != "${version}" ]; then
            echo "::error::values.yaml image.tag (${img_tag}) != Makefile VERSION (${version}). Update charts/redisoperator/values.yaml in the release commit."
            rc=1
          fi
          # The chart is not the only documented way in. The kustomize version
          # component and the plain deployment examples carry an image tag of
          # their own, and a reader who follows those paths gets whatever they
          # say. Drift there installs a different operator than the chart does,
          # while reporting success, so it is checked rather than left to the
          # release commit to remember.
          kustomize_tag="$(sed -n 's/^[[:space:]]*newTag:[[:space:]]*//p' manifests/kustomize/components/version/kustomization.yaml | head -1)"
          if [ "${kustomize_tag}" != "${version}" ]; then
            echo "::error::kustomize newTag (${kustomize_tag}) != Makefile VERSION (${version}). Update manifests/kustomize/components/version/kustomization.yaml in the release commit."
            rc=1
          fi
          for f in example/operator/operator.yaml example/operator/all-redis-operator-resources.yaml; do
            example_tag="$(sed -n 's|^[[:space:]]*-\{0,1\}[[:space:]]*image:[[:space:]]*ghcr.io/powerhome/redis-operator:||p' "${f}" | head -1)"
            if [ "${example_tag}" != "${version}" ]; then
              echo "::error::${f} image tag (${example_tag:-none}) != Makefile VERSION (${version}). Update it in the release commit."
              rc=1
            fi
          done
          # The install instructions tell a reader to fetch manifests at this git
          # tag, so it names the release they get. It appears more than once and
          # nothing else holds any of them.
          doc_mismatches="$(sed -n 's/^REDIS_OPERATOR_VERSION=//p' docs/README.md | grep -cxv "${version}" || true)"
          if [ "${doc_mismatches}" != "0" ]; then
            echo "::error::docs/README.md has ${doc_mismatches} REDIS_OPERATOR_VERSION line(s) that are not ${version}. Update every occurrence in the release commit."
            rc=1
          fi
          exit "${rc}"

  # Despite the name, this job publishes the operator image to both Docker Hub
  # (powerhome/redis-operator) and ghcr.io/powerhome/redis-operator in one build.
  # Kept as `dockerhub-image` to avoid renaming a status check that branch
  # protection may require; see PR #93 discussion.
  dockerhub-image:
    needs:
      - check
      - unit-test
      - integration-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            powerhome/redis-operator
            ghcr.io/powerhome/redis-operator
          # A pull request build carries a tag that moves to its newest image,
          # so the image it replaces keeps no tag and the scheduled prune
          # collects it. A build of master or of a release tag keeps a unique
          # commit-sha tag, which stays addressable for as long as the package
          # holds it.
          tags: |
            type=semver,pattern={{raw}}
            type=sha,prefix=,suffix=,format=long,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/bake-action@v5
        with:
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: build
          push: true
      - name: Verify the ghcr package is publicly pullable
        if: github.event_name != 'pull_request'
        run: |
          tag='${{ steps.meta.outputs.version }}'
          token=$(curl -sf "https://ghcr.io/token?scope=repository:powerhome/redis-operator:pull&service=ghcr.io" | jq -r .token)
          curl -sf -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/powerhome/redis-operator/manifests/$tag" \
            || { echo "ghcr package is not anonymously pullable"; exit 1; }

